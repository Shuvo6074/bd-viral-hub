<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loading... | BD Viral Hub</title>
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0d0d0d; --surface:#181818; --surface2:#222;
      --accent:#ff3d3d; --text:#f5f5f5; --muted:#888;
      --border:#2a2a2a; --radius:10px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
    header { background:#111; border-bottom:2px solid var(--accent); padding:0 4%; position:sticky; top:0; z-index:200; }
    .header-inner { max-width:1400px; margin:0 auto; display:flex; align-items:center; height:60px; gap:1rem; }
    .logo { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; letter-spacing:2px; color:var(--text); text-decoration:none; }
    .logo span { color:var(--accent); }
    .main { max-width:1400px; margin:0 auto; padding:1rem 2%; }
    .back-btn { display:inline-flex; align-items:center; gap:0.5rem; color:var(--muted); background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:0.4rem 1rem; cursor:pointer; font-family:inherit; font-size:0.85rem; margin-bottom:1rem; text-decoration:none; transition:all 0.2s; }
    .back-btn:hover { color:var(--text); border-color:var(--accent); }
    .player-layout { display:grid; grid-template-columns:1fr 320px; gap:1.5rem; }
    @media(max-width:768px) { .player-layout { grid-template-columns:1fr; } }
    .video-container { position:relative; padding-top:56.25%; background:#000; border-radius:var(--radius); overflow:hidden; margin-bottom:1rem; }
    .video-container video, .video-container iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
    .video-title-big { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:0.5px; margin-bottom:0.75rem; line-height:1.2; }
    .video-stats-row { display:flex; gap:1.5rem; color:var(--muted); font-size:0.82rem; margin-bottom:1rem; flex-wrap:wrap; }
    .video-actions { display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom:1rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }
    .action-btn { display:flex; align-items:center; gap:0.4rem; padding:0.5rem 1.1rem; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer; font-family:inherit; font-size:0.85rem; font-weight:600; transition:all 0.2s; text-decoration:none; }
    .action-btn:hover { border-color:var(--accent); color:var(--accent); }
    .action-btn.like-btn.liked { background:var(--accent); border-color:var(--accent); color:#fff; }
    .video-description { color:#ccc; font-size:0.9rem; line-height:1.7; margin-bottom:1rem; padding:0.75rem 1rem; background:var(--surface2); border-radius:var(--radius); border-left:3px solid var(--accent); }
    .related-title { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; margin-bottom:1rem; letter-spacing:1px; }
    .related-list { display:grid; grid-template-columns:repeat(2,1fr); gap:2px; }
    @media(min-width:600px) { .related-list { grid-template-columns:repeat(3,1fr); } }
    @media(min-width:1024px) { .related-list { grid-template-columns:repeat(2,1fr); } }
    .related-card { background:var(--surface); overflow:hidden; cursor:pointer; transition:box-shadow 0.2s; border-bottom:1px solid var(--border); text-decoration:none; color:inherit; display:block; }
    .related-card:hover { box-shadow:0 4px 20px rgba(255,61,61,0.2); }
    .related-thumb { position:relative; width:100%; padding-top:56.25%; background:#000; overflow:hidden; }
    .related-thumb img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transition:transform 0.3s; }
    .related-card:hover .related-thumb img { transform:scale(1.03); }
    .related-info { padding:0.6rem; }
    .related-title-text { font-size:0.85rem; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.4; margin-bottom:0.4rem; }
    .related-meta { font-size:0.72rem; color:var(--muted); }
    .loading { text-align:center; padding:60px; color:var(--muted); }
    .spinner { width:36px; height:36px; margin:0 auto 1rem; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .breadcrumb { font-size:0.8rem; color:var(--muted); margin-bottom:1rem; }
    .breadcrumb a { color:var(--muted); text-decoration:none; }
    .breadcrumb a:hover { color:var(--accent); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="/">BD Viral<span>Hub</span></a>
  </div>
</header>

<div class="main">
  <a class="back-btn" href="/">← হোমে ফিরুন</a>
  <div id="breadcrumb" class="breadcrumb"></div>
  <div id="player-wrap">
    <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
  </div>
</div>

<script>
const SHEET_ID = '1nHoGwVeoKe7p64ko6nkwWVY-svuonzBH936pbdv1t5A';
const API_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
let likes = JSON.parse(localStorage.getItem('vhub_likes') || '{}');
let views = JSON.parse(localStorage.getItem('vhub_views') || '{}');

function slugify(text) {
  return text.toString().toLowerCase()
    .replace(/\s+/g, '-')
    .replace(/[^\w\u0980-\u09FF-]/g, '')
    .replace(/--+/g, '-')
    .replace(/^-+|-+$/g, '')
    .substring(0, 80);
}

function formatNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'K';
  return n.toString();
}

function getEmbedUrl(url) {
  if (url.includes('archive.org/embed/')) return url;
  const arcMatch = url.match(/archive\.org\/details\/([^\/\?&]+)/);
  if (arcMatch) return `https://archive.org/embed/${arcMatch[1]}`;
  if (url.includes('drive.google.com/file/d/') && url.includes('/preview')) return url;
  const f1 = url.match(/drive\.google\.com\/file\/d\/([^\/\?&]+)/);
  if (f1) return `https://drive.google.com/file/d/${f1[1]}/preview`;
  const f2 = url.match(/[?&]id=([^&]+)/);
  if (f2) return `https://drive.google.com/file/d/${f2[1]}/preview`;
  return url;
}

const pathParts = window.location.pathname.split('/');
const currentSlug = pathParts[pathParts.length - 1];

async function loadPage() {
  try {
    const res = await fetch(API_URL);
    const text = await res.text();
    const json = JSON.parse(text.substring(47, text.length - 2));
    const rows = json.table.rows;
    const allVideos = rows.map((row, i) => ({
      id: i,
      title:     row.c[0]?.v || 'Untitled',
      videoUrl:  row.c[1]?.v || '',
      thumbnail: row.c[2]?.v || `https://picsum.photos/seed/${i}/640/360`,
      category:  row.c[3]?.v || 'General',
      date:      row.c[4]?.v || '',
      duration:  row.c[5]?.v || '',
      description: row.c[6]?.v || '',
      slug:      slugify(row.c[0]?.v || 'video') + '-' + i
    })).filter(v => v.title !== 'Title').reverse();

    const video = allVideos.find(v => v.slug === currentSlug);
    if (!video) {
      document.getElementById('player-wrap').innerHTML = '<div class="loading"><p>❌ ভিডিও পাওয়া যায়নি। <a href="/" style="color:var(--accent)">হোমে ফিরুন</a></p></div>';
      return;
    }

    views[video.id] = (views[video.id] || 0) + 1;
    localStorage.setItem('vhub_views', JSON.stringify(views));

    const siteUrl = 'https://bd-viral-hub.vercel.app';
    const pageUrl = `${siteUrl}/video/${video.slug}`;
    document.title = `${video.title} | BD Viral Hub`;
    setMeta('description', (video.description || video.title) + ' - BD Viral Hub ভাইরাল ভিডিও বাংলাদেশ ২০২৬');
    setMeta('robots', 'index, follow');
    setOrCreate('link', 'canonical', 'href', pageUrl);
    setOG('og:title', video.title + ' | BD Viral Hub');
    setOG('og:description', video.description || video.title);
    setOG('og:url', pageUrl);
    setOG('og:type', 'video.other');
    setOG('og:image', video.thumbnail);
    setOG('og:site_name', 'BD Viral Hub');

    const schema = {
      "@context": "https://schema.org",
      "@type": "VideoObject",
      "name": video.title,
      "description": video.description || video.title,
      "thumbnailUrl": video.thumbnail,
      "uploadDate": video.date || new Date().toISOString().split('T')[0],
      "contentUrl": video.videoUrl,
      "embedUrl": pageUrl,
      "publisher": { "@type": "Organization", "name": "BD Viral Hub", "url": siteUrl }
    };
    const schemaScript = document.createElement('script');
    schemaScript.type = 'application/ld+json';
    schemaScript.textContent = JSON.stringify(schema);
    document.head.appendChild(schemaScript);

    const bcSchema = {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": siteUrl },
        { "@type": "ListItem", "position": 2, "name": video.category, "item": `${siteUrl}/?cat=${video.category}` },
        { "@type": "ListItem", "position": 3, "name": video.title, "item": pageUrl }
      ]
    };
    const bcScript = document.createElement('script');
    bcScript.type = 'application/ld+json';
    bcScript.textContent = JSON.stringify(bcSchema);
    document.head.appendChild(bcScript);

    document.getElementById('breadcrumb').innerHTML =
      `<a href="/">Home</a> › <a href="/?cat=${video.category}">${video.category}</a> › ${video.title}`;

    const related = allVideos.filter(v => v.id !== video.id && v.category === video.category).slice(0, 12);

    const embedUrl = getEmbedUrl(video.videoUrl);
    const isDirectVideo = /\.(mp4|webm|ogg|mov)/i.test(video.videoUrl) && !video.videoUrl.includes('drive.google.com') && !video.videoUrl.includes('archive.org');
    const playerHTML = isDirectVideo
      ? `<video controls autoplay playsinline preload="metadata" style="position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain;"><source src="${video.videoUrl}" type="video/mp4"></video>`
      : `<iframe src="${embedUrl}" allowfullscreen allow="autoplay; fullscreen; encrypted-media" style="position:absolute;inset:0;width:100%;height:100%;border:none;background:#000"></iframe>`;

    let relatedHTML = '';
    related.forEach(v => {
      relatedHTML += `
      <a class="related-card" href="/video/${v.slug}">
        <div class="related-thumb">
          <img src="${v.thumbnail}" alt="${v.title}" loading="lazy" onerror="this.src='https://picsum.photos/seed/${v.id}/320/180'">
        </div>
        <div class="related-info">
          <div class="related-title-text">${v.title}</div>
          <div class="related-meta">👁 ${formatNum(views[v.id]||0)} · ${v.category}</div>
        </div>
      </a>`;
    });

    document.getElementById('player-wrap').innerHTML = `
    <div class="player-layout">
      <div class="player-main">
        <div class="video-container">${playerHTML}</div>
        <h1 class="video-title-big">${video.title}</h1>
        <div class="video-stats-row">
          <span>👁 ${formatNum(views[video.id]||0)} views</span>
          <span>❤️ <span id="like-count">${formatNum(likes[video.id]||0)}</span> likes</span>
          <span>📁 ${video.category}</span>
          ${video.date ? `<span>📅 ${video.date}</span>` : ''}
        </div>
        ${video.description ? `<p class="video-description">${video.description}</p>` : ''}
        <div class="video-actions">
          <button class="action-btn like-btn ${likes[video.id]?'liked':''}" onclick="toggleLike(${video.id})" id="like-btn">
            ❤️ <span id="like-count-btn">${formatNum(likes[video.id]||0)}</span> Like
          </button>
          <button class="action-btn" onclick="shareVideo()">🔗 Share</button>
        </div>
        <div id="related-mobile" style="display:none">
          <div class="related-title">Related Videos</div>
          <div class="related-list">${relatedHTML || '<p style="color:var(--muted)">No related videos</p>'}</div>
        </div>
      </div>
      <div id="related-sidebar">
        <div class="related-title">Related Videos</div>
        <div class="related-list">${relatedHTML || '<p style="color:var(--muted)">No related videos</p>'}</div>
      </div>
    </div>`;

    if (window.innerWidth < 768) {
      document.getElementById('related-mobile').style.display = 'block';
      document.getElementById('related-sidebar').style.display = 'none';
    }

  } catch(e) {
    document.getElementById('player-wrap').innerHTML = `<div class="loading"><p>❌ Error: ${e.message}</p></div>`;
  }
}

function toggleLike(id) {
  if (likes[id]) { likes[id] = 0; } else { likes[id] = (likes[id]||0)+1; }
  localStorage.setItem('vhub_likes', JSON.stringify(likes));
  const btn = document.getElementById('like-btn');
  const count = document.getElementById('like-count-btn');
  if (btn) btn.classList.toggle('liked', !!likes[id]);
  if (count) count.textContent = formatNum(likes[id]||0);
}

function shareVideo() {
  if (navigator.share) {
    navigator.share({ title: document.title, url: window.location.href });
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => alert('লিংক কপি হয়েছে!'));
  }
}

function setMeta(name, content) {
  let el = document.querySelector(`meta[name="${name}"]`);
  if (!el) { el = document.createElement('meta'); el.setAttribute('name', name); document.head.appendChild(el); }
  el.setAttribute('content', content);
}
function setOG(prop, content) {
  let el = document.querySelector(`meta[property="${prop}"]`);
  if (!el) { el = document.createElement('meta'); el.setAttribute('property', prop); document.head.appendChild(el); }
  el.setAttribute('content', content);
}
function setOrCreate(tag, rel, attr, value) {
  let el = document.querySelector(`${tag}[rel="${rel}"]`);
  if (!el) { el = document.createElement(tag); el.setAttribute('rel', rel); document.head.appendChild(el); }
  el.setAttribute(attr, value);
}

loadPage();
</script>
</body>
</html>
